<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00B4D8"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
  </defs>
  <!-- Circle background -->
  <circle cx="100" cy="100" r="95" fill="url(#g1)" opacity="0.15" stroke="url(#g1)" stroke-width="2"/>
  <!-- Cross / health symbol -->
  <rect x="85" y="50" width="30" height="100" rx="8" fill="url(#g1)"/>
  <rect x="50" y="85" width="100" height="30" rx="8" fill="url(#g1)"/>
  <!-- Leaf accent -->
  <ellipse cx="140" cy="60" rx="14" ry="22" fill="#00dcb4" opacity="0.8" transform="rotate(-30 140 60)"/>
</svg>
